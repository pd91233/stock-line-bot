<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台股 16 大產業戰略熱力圖戰情室</title>
    <!-- 引入 Tailwind CSS 與 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; transition: all 0.2s; cursor: pointer; }
        .tab-btn.active { background: #2563eb; color: #ffffff; border-color: #3b82f6; font-weight: bold; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .sector-pill { background: #111827; border: 1px solid #374151; color: #9ca3af; transition: all 0.2s; white-space: nowrap; cursor: pointer; user-select: none; }
        .sector-pill.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #ffffff; border-color: #f59e0b; font-weight: bold; box-shadow: 0 0 10px rgba(245,158,11,0.4); }
        .sector-scroll { scroll-behavior: smooth; cursor: grab; }
        .sector-scroll:active { cursor: grabbing; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none bg-[#07090e]">

    <!-- 頂部總覽列 -->
    <header class="bg-gray-900 border-b border-gray-800 px-3 py-2 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2">
            <span class="text-lg">🔥</span>
            <div>
                <div class="flex items-center space-x-1.5">
                    <h1 class="text-xs font-bold tracking-wider text-white">台股 16 大產業戰略熱力圖</h1>
                    <span class="bg-emerald-900/60 text-emerald-300 text-[9px] px-1 py-0.2 rounded border border-emerald-700/50">實盤</span>
                </div>
                <div class="flex items-center space-x-2 text-[10px] text-gray-400 mt-0.5 font-mono">
                    <span>總額: <strong id="stat-total-val" class="text-white">-- 億</strong></span>
                    <span>•</span>
                    <span>平均: <strong id="stat-avg-chg" class="text-red-400">--%</strong></span>
                    <span>•</span>
                    <span id="update-time" class="text-emerald-400">載入中</span>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-1">
            <button onclick="triggerRefresh()" id="refresh-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] px-2.5 py-1 rounded-md font-medium transition shadow cursor-pointer">
                <span>⚡ 重新整理</span>
            </button>
        </div>
    </header>

    <!-- 控制面板 -->
    <div class="bg-gray-900/95 border-b border-gray-800 px-3 py-2 space-y-1.5 shrink-0 shadow-md z-20">
        
        <!-- 第一排：市場與模式 -->
        <div class="flex items-center justify-between text-xs">
            <div class="flex items-center space-x-1">
                <span class="text-[11px] text-gray-400 mr-0.5">市場:</span>
                <button onclick="setMarketFilter('ALL')" id="market-all" class="tab-btn active text-[11px] px-2.5 py-0.5 rounded">全部</button>
                <button onclick="setMarketFilter('TSE')" id="market-tse" class="tab-btn text-[11px] px-2.5 py-0.5 rounded">上市</button>
                <button onclick="setMarketFilter('OTC')" id="market-otc" class="tab-btn text-[11px] px-2.5 py-0.5 rounded">上櫃</button>
            </div>

            <div class="flex items-center space-x-1">
                <span class="text-[11px] text-gray-400 mr-0.5">視角:</span>
                <button onclick="switchViewMode('heatmap')" id="btn-mode-heatmap" class="tab-btn active text-[11px] px-2.5 py-0.5 rounded">產業</button>
                <button onclick="switchViewMode('stock_heatmap')" id="btn-mode-stock-heatmap" class="tab-btn text-[11px] px-2.5 py-0.5 rounded">個股</button>
                <button onclick="switchViewMode('list')" id="btn-mode-list" class="tab-btn text-[11px] px-2.5 py-0.5 rounded">排行</button>
            </div>
        </div>

        <!-- 第二排：權重 -->
        <div class="flex items-center space-x-1 pt-1 border-t border-gray-800/60 text-xs">
            <span class="text-[11px] text-gray-400 mr-1">權重:</span>
            <button onclick="setWeightMetric('tradeValue')" id="weight-val" class="tab-btn active text-[11px] px-2.5 py-0.5 rounded">成交額</button>
            <button onclick="setWeightMetric('tradeVolume')" id="weight-vol" class="tab-btn text-[11px] px-2.5 py-0.5 rounded">量</button>
            <button onclick="setWeightMetric('mcap')" id="weight-mcap" class="tab-btn text-[11px] px-2.5 py-0.5 rounded">市值</button>
        </div>

        <!-- 第三與第四排：雙行對齊佈局 (1~8 產業 / 9~16 產業) -->
        <div class="pt-1 border-t border-gray-800/60 space-y-1">
            <div class="flex items-center space-x-2">
                <div id="all-sector-container" class="shrink-0"></div>
                <div class="flex items-center space-x-1 flex-1 overflow-hidden bg-gray-950/40 px-1.5 py-0.5 rounded-lg border border-gray-800/80">
                    <button onclick="scrollBar('row1-wrapper', -200)" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-2 py-0.5 rounded text-xs shrink-0 cursor-pointer shadow font-bold transition">◀</button>
                    <div id="row1-wrapper" class="sector-scroll flex space-x-1.5 overflow-x-auto hide-scroll flex-1 py-0.5">
                        <div id="row1-container" class="flex space-x-1.5 shrink-0"></div>
                    </div>
                    <button onclick="scrollBar('row1-wrapper', 200)" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-2 py-0.5 rounded text-xs shrink-0 cursor-pointer shadow font-bold transition">▶</button>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <div class="shrink-0 opacity-0 pointer-events-none" style="width: 92px;"></div>
                <div class="flex items-center space-x-1 flex-1 overflow-hidden bg-gray-950/40 px-1.5 py-0.5 rounded-lg border border-gray-800/80">
                    <button onclick="scrollBar('row2-wrapper', -200)" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-2 py-0.5 rounded text-xs shrink-0 cursor-pointer shadow font-bold transition">◀</button>
                    <div id="row2-wrapper" class="sector-scroll flex space-x-1.5 overflow-x-auto hide-scroll flex-1 py-0.5">
                        <div id="row2-container" class="flex space-x-1.5 shrink-0"></div>
                    </div>
                    <button onclick="scrollBar('row2-wrapper', 200)" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-2 py-0.5 rounded text-xs shrink-0 cursor-pointer shadow font-bold transition">▶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 主內容區 -->
    <main class="flex-1 relative w-full bg-[#07090e] overflow-hidden">
        <div id="back-bar" class="absolute top-3 left-3 z-10 hidden">
            <button onclick="resetDrillDown()" class="bg-gray-900/90 hover:bg-gray-800 text-white text-xs px-3 py-1.5 rounded-lg border border-gray-700 shadow-xl flex items-center space-x-1 backdrop-blur cursor-pointer">
                <span>⬅ 返回全部總覽</span>
            </button>
        </div>

        <div id="treemap-container" class="w-full h-full"></div>
        <div id="list-container" class="absolute inset-0 overflow-y-auto p-3 space-y-2 hidden"></div>
    </main>

    <!-- 底部抽屜 -->
    <div id="stock-sheet" class="fixed inset-x-0 bottom-0 z-50 transform translate-y-full transition-transform duration-300 ease-out bg-gray-900 border-t border-gray-700 rounded-t-2xl shadow-2xl max-h-[85vh] flex flex-col">
        <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto my-2 shrink-0"></div>
        <div id="sheet-content" class="p-4 overflow-y-auto space-y-4"></div>
    </div>

    <div id="backdrop" onclick="closeStockSheet()" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-xs transition-opacity"></div>

    <script>
        let rawStocksData = [];
        let currentViewMode = 'heatmap';
        let currentMarketFilter = 'ALL';
        let currentWeightMetric = 'tradeValue';
        let activeSectorFilter = 'ALL';
        let currentDrillSector = null;
        let chartInstance = null;

        window.addEventListener('DOMContentLoaded', () => {
            const chartDom = document.getElementById('treemap-container');
            chartInstance = echarts.init(chartDom);
            
            chartInstance.on('click', function (params) {
                if (params.data && params.data.type === 'stock') {
                    openStockSheet(params.data.symbol);
                } else if (params.data && params.data.type === 'sector' && currentViewMode === 'heatmap') {
                    currentDrillSector = params.data.name;
                    document.getElementById('back-bar').classList.remove('hidden');
                    renderChart();
                }
            });

            window.addEventListener('resize', () => chartInstance.resize());

            ['row1-wrapper', 'row2-wrapper'].forEach(id => {
                const wrapper = document.getElementById(id);
                wrapper.addEventListener('wheel', (evt) => {
                    evt.preventDefault();
                    wrapper.scrollLeft += evt.deltaY;
                });

                let isDown = false, startX, scrollLeft;
                wrapper.addEventListener('mousedown', (e) => {
                    isDown = true;
                    startX = e.pageX - wrapper.offsetLeft;
                    scrollLeft = wrapper.scrollLeft;
                });
                wrapper.addEventListener('mouseleave', () => isDown = false);
                wrapper.addEventListener('mouseup', () => isDown = false);
                wrapper.addEventListener('mousemove', (e) => {
                    if(!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - wrapper.offsetLeft;
                    const walk = (x - startX) * 1.5;
                    wrapper.scrollLeft = scrollLeft - walk;
                });
            });

            loadMarketData();
        });

        function scrollBar(wrapperId, offset) {
            const wrapper = document.getElementById(wrapperId);
            wrapper.scrollLeft += offset;
        }

        async function loadMarketData(force = false) {
            const btn = document.getElementById('refresh-btn');
            btn.innerHTML = '<span>⏳...</span>';
            try {
                const url = force ? '/api/heatmap/snapshot?force=1' : '/api/heatmap/snapshot';
                const res = await fetch(url);
                const json = await res.json();
                if (json.status === 'ok') {
                    rawStocksData = json.stocks;
                    document.getElementById('update-time').innerText = json.updatedAt || new Date().toLocaleTimeString();
                    updateTopSummaryStats();
                    buildSectorPills();
                    renderChart();
                    if (currentViewMode === 'list') renderListMode();
                }
            } catch (e) {
                console.error("載入行情失敗:", e);
            } finally {
                btn.innerHTML = '<span>⚡ 重新整理</span>';
            }
        }

        function triggerRefresh() { loadMarketData(true); }

        function updateTopSummaryStats() {
            let totalVal = 0;
            let weightedChgSum = 0;
            rawStocksData.forEach(s => {
                totalVal += (s.tradeValue || 0);
                weightedChgSum += (s.changePercent || 0) * (s.tradeValue || 1);
            });
            const avgChg = totalVal > 0 ? (weightedChgSum / totalVal).toFixed(2) : 0;
            
            document.getElementById('stat-total-val').innerText = `${totalVal.toFixed(1)} 億`;
            const avgEl = document.getElementById('stat-avg-chg');
            avgEl.innerText = `${avgChg > 0 ? '+' : ''}${avgChg}%`;
            avgEl.className = avgChg >= 0 ? "text-red-400" : "text-emerald-400";
        }

        function setMarketFilter(market) {
            currentMarketFilter = market;
            ['all', 'tse', 'otc'].forEach(m => {
                const btn = document.getElementById(`market-${m}`);
                if (btn) btn.classList.toggle('active', m === market.toLowerCase());
            });
            renderChart();
            if (currentViewMode === 'list') renderListMode();
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            ['heatmap', 'stock_heatmap', 'list'].forEach(m => {
                const btnId = m === 'stock_heatmap' ? 'btn-mode-stock-heatmap' : (m === 'heatmap' ? 'btn-mode-heatmap' : 'btn-mode-list');
                const btn = document.getElementById(btnId);
                if (btn) btn.classList.toggle('active', m === mode);
            });

            const hmContainer = document.getElementById('treemap-container');
            const listContainer = document.getElementById('list-container');

            if (mode === 'list') {
                hmContainer.classList.add('hidden');
                listContainer.classList.remove('hidden');
                renderListMode();
            } else {
                hmContainer.classList.remove('hidden');
                listContainer.classList.add('hidden');
                chartInstance.resize();
                renderChart();
            }
        }

        function setWeightMetric(metric) {
            currentWeightMetric = metric;
            const weightMap = {'tradeValue': 'val', 'tradeVolume': 'vol', 'mcap': 'mcap'};
            Object.entries(weightMap).forEach(([k, id]) => {
                const btn = document.getElementById(`weight-${id}`);
                if (btn) btn.classList.toggle('active', k === metric);
            });
            renderChart();
        }

        function buildSectorPills() {
            const allContainer = document.getElementById('all-sector-container');
            const allActive = activeSectorFilter === 'ALL' ? 'active' : '';
            allContainer.innerHTML = `<button onclick="filterSector('ALL')" class="sector-pill ${allActive} text-[11px] px-3 py-1.5 rounded-lg font-medium shrink-0 flex items-center space-x-1"><span>🔥 全部產業</span></button>`;

            const sectorMap = {};
            rawStocksData.forEach(s => {
                if (!sectorMap[s.sector]) sectorMap[s.sector] = { totalVal: 0, weightedChg: 0 };
                sectorMap[s.sector].totalVal += s.tradeValue;
                sectorMap[s.sector].weightedChg += s.changePercent * s.tradeValue;
            });

            const sortedSectors = Object.keys(sectorMap).sort((a, b) => sectorMap[b].totalVal - sectorMap[a].totalVal);

            // 將 16 大產業平分為兩行 (每行 8 個)
            const mid = Math.ceil(sortedSectors.length / 2);
            const row1Sectors = sortedSectors.slice(0, mid);
            const row2Sectors = sortedSectors.slice(mid);

            const row1Container = document.getElementById('row1-container');
            let row1Html = '';
            row1Sectors.forEach((sec, idx) => {
                const active = activeSectorFilter === sec ? 'active' : '';
                const grp = sectorMap[sec];
                const avgChg = grp.totalVal > 0 ? (grp.weightedChg / grp.totalVal).toFixed(2) : 0;
                const sign = avgChg >= 0 ? '+' : '';
                const colorClass = avgChg >= 0 ? 'text-red-400' : 'text-emerald-400';

                row1Html += `
                    <button onclick="filterSector('${sec}')" class="sector-pill ${active} text-[11px] px-2.5 py-1 rounded-md shrink-0 flex items-center space-x-1">
                        <span class="font-bold">#${idx+1} ${sec}</span>
                        <span class="text-gray-400 font-mono">${grp.totalVal.toFixed(1)}億</span>
                        <span class="font-mono font-bold ${colorClass}">${sign}${avgChg}%</span>
                    </button>
                `;
            });
            row1Container.innerHTML = row1Html;

            const row2Container = document.getElementById('row2-container');
            let row2Html = '';
            row2Sectors.forEach((sec, idx) => {
                const actualIdx = idx + mid;
                const active = activeSectorFilter === sec ? 'active' : '';
                const grp = sectorMap[sec];
                const avgChg = grp.totalVal > 0 ? (grp.weightedChg / grp.totalVal).toFixed(2) : 0;
                const sign = avgChg >= 0 ? '+' : '';
                const colorClass = avgChg >= 0 ? 'text-red-400' : 'text-emerald-400';

                row2Html += `
                    <button onclick="filterSector('${sec}')" class="sector-pill ${active} text-[11px] px-2.5 py-1 rounded-md shrink-0 flex items-center space-x-1">
                        <span class="font-bold">#${actualIdx+1} ${sec}</span>
                        <span class="text-gray-400 font-mono">${grp.totalVal.toFixed(1)}億</span>
                        <span class="font-mono font-bold ${colorClass}">${sign}${avgChg}%</span>
                    </button>
                `;
            });
            row2Container.innerHTML = row2Html;
        }

        function filterSector(sec) {
            activeSectorFilter = sec;
            currentDrillSector = null;
            document.getElementById('back-bar').classList.add('hidden');
            buildSectorPills();
            renderChart();
            if (currentViewMode === 'list') renderListMode();
        }

        function resetDrillDown() {
            currentDrillSector = null;
            document.getElementById('back-bar').classList.add('hidden');
            renderChart();
        }

        function getColorByChange(pct) {
            if (pct >= 5) return '#991b1b';
            if (pct >= 2) return '#dc2626';
            if (pct > 0) return '#b91c1c';
            if (pct === 0) return '#374151';
            if (pct > -2) return '#047857';
            if (pct > -5) return '#059669';
            return '#065f46';
        }

        function renderChart() {
            let dataFiltered = [...rawStocksData];

            if (currentMarketFilter !== 'ALL') {
                dataFiltered = dataFiltered.filter(s => s.market === currentMarketFilter);
            }
            if (activeSectorFilter !== 'ALL') {
                dataFiltered = dataFiltered.filter(s => s.sector === activeSectorFilter);
            }
            if (currentDrillSector && currentViewMode === 'heatmap') {
                document.getElementById('back-bar').classList.remove('hidden');
                dataFiltered = dataFiltered.filter(s => s.sector === currentDrillSector);
            } else {
                document.getElementById('back-bar').classList.add('hidden');
            }

            let treeSeriesData = [];

            if (currentViewMode === 'stock_heatmap') {
                let children = dataFiltered.map(st => {
                    let val = st[currentWeightMetric] || st.tradeValue || 1;
                    if (val <= 0) val = 0.5;
                    return {
                        name: `${st.name}\n${st.price} (${st.changePercent >= 0 ? '+' : ''}${st.changePercent}%)`,
                        value: val,
                        itemStyle: { color: getColorByChange(st.changePercent) },
                        symbol: st.symbol,
                        type: 'stock',
                        raw: st
                    };
                });
                children.sort((a, b) => b.value - a.value);
                treeSeriesData = [{ name: '個股熱力總覽', children: children }];
            } else {
                const sectorGroups = {};
                dataFiltered.forEach(s => {
                    if (!sectorGroups[s.sector]) sectorGroups[s.sector] = { stocks: [], totalVal: 0, weightedChg: 0 };
                    sectorGroups[s.sector].stocks.push(s);
                    sectorGroups[s.sector].totalVal += s.tradeValue;
                    sectorGroups[s.sector].weightedChg += s.changePercent * s.tradeValue;
                });

                Object.keys(sectorGroups).forEach((sec, idx) => {
                    const grp = sectorGroups[sec];
                    const avgChg = grp.totalVal > 0 ? (grp.weightedChg / grp.totalVal).toFixed(2) : 0;
                    const sign = avgChg >= 0 ? '+' : '';
                    const groupTitle = `#${idx+1} ${sec}  ${sign}${avgChg}%  (${grp.totalVal.toFixed(1)}億)`;

                    let sectorStocks = [...grp.stocks];
                    sectorStocks.sort((a, b) => b.tradeValue - a.tradeValue);
                    
                    if (activeSectorFilter === 'ALL' && !currentDrillSector) {
                        sectorStocks = sectorStocks.slice(0, 10); // 總覽時每個產業取前 10 大菁英
                    }

                    let children = sectorStocks.map(st => {
                        let val = st[currentWeightMetric] || st.tradeValue || 1;
                        if (val <= 0) val = 0.5;
                        return {
                            name: `${st.name}\n${st.price} (${st.changePercent >= 0 ? '+' : ''}${st.changePercent}%)`,
                            value: val,
                            itemStyle: { color: getColorByChange(st.changePercent) },
                            symbol: st.symbol,
                            type: 'stock',
                            raw: st
                        };
                    });

                    treeSeriesData.push({
                        name: groupTitle,
                        children: children
                    });
                });
            }

            const option = {
                tooltip: {
                    formatter: function (info) {
                        if (info.data.type === 'stock') {
                            const st = info.data.raw;
                            const sign = st.changePercent >= 0 ? '+' : '';
                            return `<div class="p-2 text-xs">
                                <div class="font-bold text-sm">${st.name} (${st.symbol})</div>
                                <div>現價: <span class="font-mono font-bold">${st.price}</span> (${sign}${st.changePercent}%)</div>
                                <div>成交額: <span class="font-mono text-blue-400">${st.tradeValue}億</span></div>
                                <div>成交量: <span class="font-mono">${st.tradeVolume}張</span></div>
                                <div class="text-[10px] text-gray-400 mt-1">👆 點擊查看最佳五檔明細</div>
                            </div>`;
                        }
                        return `<b>${info.name}</b>`;
                    }
                },
                series: [{
                    type: 'treemap',
                    width: '100%',
                    height: '100%',
                    roam: false,
                    nodeClick: (currentDrillSector || currentViewMode === 'stock_heatmap') ? false : 'zoomToNode',
                    breadcrumb: { show: false },
                    label: {
                        show: true,
                        formatter: '{b}',
                        fontSize: 11,
                        fontWeight: 'bold',
                        color: '#fff'
                    },
                    upperLabel: {
                        show: true,
                        height: 24,
                        fontSize: 12,
                        fontWeight: 'bold',
                        color: '#fff',
                        backgroundColor: 'rgba(15,23,42,0.85)'
                    },
                    itemStyle: {
                        borderColor: '#0b0f19',
                        borderWidth: 2,
                        gapWidth: 2
                    },
                    data: treeSeriesData
                }]
            };

            chartInstance.setOption(option);
        }

        function renderListMode() {
            const container = document.getElementById('list-container');
            let list = [...rawStocksData];
            if (currentMarketFilter !== 'ALL') list = list.filter(s => s.market === currentMarketFilter);
            if (activeSectorFilter !== 'ALL') list = list.filter(s => s.sector === activeSectorFilter);
            list.sort((a, b) => b.tradeValue - a.tradeValue);

            let html = '';
            list.forEach((st, idx) => {
                const sign = st.changePercent >= 0 ? '+' : '';
                const colorClass = st.changePercent > 0 ? 'text-red-400 bg-red-950/40 border-red-900/50' : (st.changePercent < 0 ? 'text-emerald-400 bg-emerald-950/40 border-emerald-900/50' : 'text-gray-300 bg-gray-800 border-gray-700');
                html += `
                    <div onclick="openStockSheet('${st.symbol}')" class="bg-gray-900/90 border border-gray-800 rounded-xl p-3 flex items-center justify-between active:scale-[0.99] transition shadow cursor-pointer">
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-mono text-gray-500 w-5">#${idx+1}</span>
                            <div>
                                <div class="font-bold text-sm text-white flex items-center space-x-2">
                                    <span>${st.name}</span>
                                    <span class="text-xs text-gray-400 font-mono">${st.symbol}</span>
                                    <span class="text-[10px] bg-gray-800 text-gray-300 px-1.5 py-0.5 rounded">${st.sector}</span>
                                </div>
                                <div class="text-xs text-gray-400 mt-0.5">成交額 <span class="text-blue-400 font-mono">${st.tradeValue}億</span> | 量 ${st.tradeVolume}張</div>
                            </div>
                        </div>
                        <div class="text-right px-3 py-1.5 rounded-lg border ${colorClass}">
                            <div class="text-sm font-bold font-mono">${st.price}</div>
                            <div class="text-xs font-mono font-medium">${sign}${st.changePercent}%</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function openStockSheet(symbol) {
            const sheet = document.getElementById('stock-sheet');
            const backdrop = document.getElementById('backdrop');
            const content = document.getElementById('sheet-content');

            backdrop.classList.remove('hidden');
            sheet.classList.remove('translate-y-full');
            content.innerHTML = `<div class="py-12 text-center text-gray-400">⏳ 正在向富果 API 查詢 ${symbol} 最新五檔明細...</div>`;

            try {
                const res = await fetch(`/api/heatmap/quote/${symbol}`);
                const json = await res.json();
                if (json.status === 'ok') {
                    const st = json.stock;
                    const sign = st.changePercent >= 0 ? '+' : '';
                    const colorStyle = st.changePercent > 0 ? 'text-red-400' : (st.changePercent < 0 ? 'text-emerald-400' : 'text-gray-350');
                    const totalVol = (st.bidVol || 1) + (st.askVol || 1);
                    const bidPct = Math.round((st.bidVol / totalVol) * 100);
                    const askPct = 100 - bidPct;

                    let html = `
                        <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                            <div>
                                <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                                    <span>${st.name}</span>
                                    <span class="text-sm font-mono text-gray-400">${st.symbol}</span>
                                    <span class="text-xs bg-blue-900/60 text-blue-300 px-2 py-0.5 rounded">${st.sector}</span>
                                </h2>
                            </div>
                            <button onclick="closeStockSheet()" class="text-gray-400 hover:text-white p-1 cursor-pointer">✕</button>
                        </div>
                        <div class="bg-gray-800/60 border border-gray-700/60 rounded-xl p-3 flex items-center justify-between">
                            <div>
                                <div class="text-xs text-gray-400">現價 / 漲跌</div>
                                <div class="text-2xl font-bold font-mono ${colorStyle} mt-0.5">${st.price}</div>
                                <div class="text-xs font-mono ${colorStyle}">${sign}${st.change} (${sign}${st.changePercent}%)</div>
                            </div>
                            <div class="text-right space-y-1 font-mono text-xs">
                                <div>開: <span class="text-white">${st.openPrice}</span> | 高: <span class="text-red-400">${st.highPrice}</span></div>
                                <div>低: <span class="text-emerald-400">${st.lowPrice}</span> | 均: <span class="text-blue-300">${st.avgPrice}</span></div>
                                <div>成交額: <span class="text-blue-400 font-bold">${st.tradeValue}億</span></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-gray-400 mb-1">
                                <span>🔴 內盤買盤 (${bidPct}%)</span>
                                <span>🟢 外盤賣壓 (${askPct}%)</span>
                            </div>
                            <div class="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden flex">
                                <div style="width: ${bidPct}%" class="bg-red-600 h-full"></div>
                                <div style="width: ${askPct}%" class="bg-emerald-600 h-full"></div>
                            </div>
                        </div>
                        <div class="space-y-1">
                            <div class="text-xs font-bold text-gray-400 mb-1">📊 最佳五檔委託即時報價</div>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <div class="bg-gray-800/40 p-2 rounded-lg border border-gray-800">
                                    <div class="text-[10px] text-red-400 font-bold mb-1">委買價 / 張數</div>
                                    ${(st.bids && st.bids.length > 0) ? st.bids.map(b => `<div class="flex justify-between font-mono py-0.5"><span class="text-red-400 font-bold">${b.price}</span><span class="text-gray-300">${b.size}</span></div>`).join('') : '<div class="text-gray-500 text-center py-2">無委買資料</div>'}
                                </div>
                                <div class="bg-gray-800/40 p-2 rounded-lg border border-gray-800">
                                    <div class="text-[10px] text-emerald-400 font-bold mb-1">委賣價 / 張數</div>
                                    ${(st.asks && st.asks.length > 0) ? st.asks.map(a => `<div class="flex justify-between font-mono py-0.5"><span class="text-emerald-400 font-bold">${a.price}</span><span class="text-gray-300">${a.size}</span></div>`).join('') : '<div class="text-gray-500 text-center py-2">無委賣資料</div>'}
                                </div>
                            </div>
                        </div>
                    `;
                    content.innerHTML = html;
                }
            } catch (e) {
                content.innerHTML = `<div class="py-8 text-center text-red-400">⚠️ 取得五檔資料發生異常</div>`;
            }
        }

        function closeStockSheet() {
            document.getElementById('stock-sheet').classList.add('translate-y-full');
            document.getElementById('backdrop').classList.add('hidden');
        }
    </script>
</body>
</html>
